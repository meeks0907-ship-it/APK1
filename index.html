<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>간격 카운팅 & 오버타임 알람</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #162032;
            --input-bg: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --overtime-color: #f59e0b;
            --danger-color: #ef4444;
            --border-color: #26354d;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .status-display {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .status-display.overtime {
            color: var(--overtime-color);
        }

        .timer-display {
            text-align: center;
            font-size: 48px;
            font-weight: 800;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .test-btn {
            width: 100%;
            height: 42px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 17, 32, 0.95);
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }

        .bottom-inner {
            width: 100%;
            max-width: 500px;
        }

        .main-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        #startBtn { background: var(--accent-color); color: #fff; }
        #stopBtn { background: var(--danger-color); color: #fff; display: none; }
    </style>
</head>
<body>

<h2>⏰ 간격 카운팅 알람</h2>

<div class="card">
    <div class="status-display" id="statusText">대기 중</div>
    <div class="timer-display" id="timeDisplay">00:00</div>
</div>

<div class="card">
    <div class="grid-row">
        <div class="form-group">
            <label>최종 목표 시간 (분)</label>
            <input type="number" id="targetMinutes" value="1" min="1">
        </div>
        <div class="form-group">
            <label>카운팅 간격 (초)</label>
            <input type="number" id="intervalSeconds" value="10" min="1">
        </div>
    </div>

    <div class="grid-row">
        <div class="form-group">
            <label>오버타임 허용 (분)</label>
            <input type="number" id="overtimeMinutes" value="1" min="0">
        </div>
        <div class="form-group">
            <label>음성 언어</label>
            <select id="langSelect">
                <option value="ko-KR">한국어</option>
                <option value="en-US">영어</option>
                <option value="ja-JP">일본어</option>
                <option value="zh-CN">중국어</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>목소리 성별</label>
        <select id="voiceGender">
            <option value="female">여성 목소리</option>
            <option value="male">남성 목소리</option>
        </select>
    </div>

    <button type="button" class="test-btn" onclick="testVoice()">🔊 음성 테스트</button>
</div>

<div class="bottom-bar">
    <div class="bottom-inner">
        <button id="startBtn" class="main-btn" onclick="startAlarm()">알람 시작하기</button>
        <button id="stopBtn" class="main-btn" onclick="stopAlarm()">알람 중지</button>
    </div>
</div>

<script>
    let timerId = null;
    let startTimeMs = 0;
    let lastSpokenStep = 0;
    let targetSec = 0;
    let intervalSec = 10;
    let overtimeSec = 0;

    function formatTime(totalSec) {
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function formatDurationText(sec, lang) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        const isKo = lang.startsWith('ko');
        const isJa = lang.startsWith('ja');
        const isZh = lang.startsWith('zh');

        let parts = [];
        if (isKo) {
            if (h > 0) parts.push(`${h}시간`);
            if (m > 0) parts.push(`${m}분`);
            if (s > 0) parts.push(`${s}초`);
            return parts.join(' ');
        } else if (isJa) {
            if (h > 0) parts.push(`${h}時間`);
            if (m > 0) parts.push(`${m}分`);
            if (s > 0) parts.push(`${s}秒`);
            return parts.join('');
        } else if (isZh) {
            if (h > 0) parts.push(`${h}小时`);
            if (m > 0) parts.push(`${m}分钟`);
            if (s > 0) parts.push(`${s}秒`);
            return parts.join('');
        } else {
            if (h > 0) parts.push(`${h} hour`);
            if (m > 0) parts.push(`${m} minutes`);
            if (s > 0) parts.push(`${s} seconds`);
            return parts.join(' ');
        }
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const lang = document.getElementById('langSelect').value;
        const gender = document.getElementById('voiceGender').value;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.pitch = gender === 'male' ? 0.8 : 1.1;
        utterance.rate = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const selectedLang = lang.slice(0, 2).toLowerCase();
        const matchedVoice = voices.find(v => v.lang.toLowerCase().includes(selectedLang));
        if (matchedVoice) {
            utterance.voice = matchedVoice;
        }

        window.speechSynthesis.speak(utterance);
    }

    function testVoice() {
        const lang = document.getElementById('langSelect').value;
        const msg = lang.startsWith('ko') ? "10초, 음성 테스트입니다." : "10 seconds, voice test.";
        speak(msg);
    }

    function startAlarm() {
        const targetMin = parseInt(document.getElementById('targetMinutes').value, 10) || 1;
        intervalSec = parseInt(document.getElementById('intervalSeconds').value, 10) || 10;
        const overtimeMin = parseInt(document.getElementById('overtimeMinutes').value, 10) || 0;

        targetSec = targetMin * 60;
        overtimeSec = targetSec + (overtimeMin * 60);
        startTimeMs = Date.now();
        lastSpokenStep = 0;

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        document.getElementById('statusText').innerText = "알람 작동 중";
        document.getElementById('statusText').classList.remove('overtime');

        const lang = document.getElementById('langSelect').value;
        speak(lang.startsWith('ko') ? "알람을 시작합니다." : "Alarm started.");

        if (timerId) clearInterval(timerId);

        timerId = setInterval(() => {
            const elapsedSeconds = Math.floor((Date.now() - startTimeMs) / 1000);
            document.getElementById('timeDisplay').innerText = formatTime(elapsedSeconds);

            const currentLang = document.getElementById('langSelect').value;
            const isKo = currentLang.startsWith('ko');
            const currentStep = Math.floor(elapsedSeconds / intervalSec);

            if (currentStep > lastSpokenStep && elapsedSeconds > 0) {
                lastSpokenStep = currentStep;
                const stepTimeSec = currentStep * intervalSec;

                if (stepTimeSec < targetSec) {
                    speak(formatDurationText(stepTimeSec, currentLang));
                } else if (stepTimeSec === targetSec) {
                    const targetText = formatDurationText(targetSec, currentLang);
                    speak(isKo ? `${targetText}, 목표 시간입니다.` : `${targetText}, target time reached.`);
                    document.getElementById('statusText').innerText = "오버타임 구간";
                    document.getElementById('statusText').classList.add('overtime');
                } else if (stepTimeSec < overtimeSec) {
                    const overSec = stepTimeSec - targetSec;
                    const overText = formatDurationText(overSec, currentLang);
                    speak(isKo ? `${overText} 초과` : `${overText} over`);
                    document.getElementById('statusText').innerText = "오버타임 진행 중";
                    document.getElementById('statusText').classList.add('overtime');
                }
            }

            if (elapsedSeconds >= targetSec && elapsedSeconds < overtimeSec && document.getElementById('statusText').innerText === "알람 작동 중") {
                document.getElementById('statusText').innerText = "오버타임 진행 중";
                document.getElementById('statusText').classList.add('overtime');
                if (targetSec % intervalSec !== 0) {
                    const targetText = formatDurationText(targetSec, currentLang);
                    speak(isKo ? `${targetText}, 목표 시간입니다.` : `${targetText}, target time reached.`);
                }
            }

            if (elapsedSeconds >= overtimeSec) {
                const totalOverText = formatDurationText(overtimeSec - targetSec, currentLang);
                speak(isKo ? `${totalOverText} 초과. 알람을 종료합니다.` : "Overtime finished. Alarm stopped.");
                stopAlarm(true);
            }
        }, 250);
    }

    function stopAlarm(isFinished = false) {
        if (timerId) clearInterval(timerId);
        timerId = null;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        const statusEl = document.getElementById('statusText');
        statusEl.innerText = isFinished ? "완료 및 종료됨" : "중지됨";
        statusEl.classList.remove('overtime');
    }
</script>

</body>
</html>
